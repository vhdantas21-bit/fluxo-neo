# Mantém o projeto Supabase ativo.
# No plano grátis, o Supabase pausa projetos sem uso durante cerca de uma
# semana; esta automação chama a função public.keepalive() a cada 3 dias
# (ver supabase/migrations/0003_keepalive.sql). Usa só a chave pública
# (publishable), guardada nas variáveis do repositório.
name: Manter Supabase ativo

on:
  schedule:
    - cron: '17 9 */3 * *' # 09:17 UTC, a cada 3 dias
  workflow_dispatch: # permite rodar à mão em Actions → Run workflow

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar keepalive() no banco
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Defina SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY em Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          for attempt in 1 2 3; do
            status=$(curl -sS -o resposta.txt -w '%{http_code}' --max-time 30 \
              -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
              -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}' || true)
            echo "Tentativa $attempt: HTTP $status — $(cat resposta.txt 2>/dev/null)"
            [ "$status" = "200" ] && exit 0
            sleep 20
          done
          echo "O banco não respondeu. Se o projeto estiver pausado, reative em supabase.com/dashboard."
          exit 1
