<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171717" />
    <meta name="description" content="FLUXO NEO — gestão de tarefas pessoais em quadro Kanban." />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>FLUXO NEO</title>
    <script>
      // Aplica o tema guardado antes da primeira pintura (evita "piscar").
      try {
        var t = localStorage.getItem('fluxo-neo-theme') === 'light' ? 'light' : 'dark'
        var r = document.documentElement
        r.dataset.theme = t
        r.classList.add(t)
        r.style.colorScheme = t
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f5f7')
      } catch (e) {}
    </script>
    <style>
      /* Preload: aparece antes do JavaScript; o app o remove quando estiver pronto (src/lib/preload.ts). */
      #preload {
        --pl-bg: #171717;
        --pl-fg: #fefefe;
        --pl-neo: #9db3e6;
        --pl-sub: #8f8f8f;
        --pl-white: #fefefe;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(60% 45% at 50% 38%, rgb(19 41 103 / 0.45), transparent 70%),
          var(--pl-bg);
        color: var(--pl-fg);
        font-family: 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 280ms ease, visibility 280ms;
      }
      :root[data-theme='light'] #preload {
        --pl-bg: #f5f5f6;
        --pl-fg: #171717;
        --pl-neo: #2c50a1;
        --pl-sub: #616161;
        background:
          radial-gradient(60% 45% at 50% 38%, rgb(44 80 161 / 0.12), transparent 70%),
          var(--pl-bg);
      }
      #preload.pl-hide {
        opacity: 0;
        visibility: hidden;
      }
      .pl-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        animation: pl-in 420ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .pl-mark {
        width: 76px;
        height: 76px;
        border-radius: 18px;
        box-shadow: 0 18px 40px -16px rgb(0 0 0 / 0.55), 0 0 0 1px rgb(255 255 255 / 0.06);
      }
      :root[data-theme='light'] .pl-mark {
        box-shadow: 0 18px 40px -18px rgb(16 24 40 / 0.35), 0 0 0 1px rgb(16 24 40 / 0.08);
      }
      .pl-mark path {
        animation: pl-piece 520ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .pl-mark path:nth-child(2) { animation-delay: 90ms; }
      .pl-mark path:nth-child(3) { animation-delay: 180ms; }
      .pl-mark path:nth-child(4) { animation-delay: 270ms; }
      .pl-word {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.16em;
        line-height: 1;
      }
      .pl-word span {
        margin-left: 0.4em;
        font-weight: 500;
        color: var(--pl-neo);
      }
      .pl-stripes {
        display: flex;
        gap: 6px;
        height: 22px;
        margin-top: 4px;
      }
      .pl-stripes i {
        width: 9px;
        height: 100%;
        border-radius: 2px;
        transform: skewX(-28deg);
        animation: pl-wave 1.1s ease-in-out infinite;
      }
      .pl-stripes i:nth-child(1) { background: #2c50a1; }
      .pl-stripes i:nth-child(2) { background: #132967; animation-delay: 110ms; }
      .pl-stripes i:nth-child(3) { background: #c43004; animation-delay: 220ms; }
      .pl-stripes i:nth-child(4) { background: var(--pl-white); animation-delay: 330ms; }
      .pl-stripes i:nth-child(5) { background: #424242; animation-delay: 440ms; }
      :root[data-theme='light'] .pl-stripes i:nth-child(4) { box-shadow: inset 0 0 0 1px #b8b8be; }
      .pl-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      @keyframes pl-in {
        from { opacity: 0; transform: translateY(8px) scale(0.98); }
        to { opacity: 1; transform: none; }
      }
      @keyframes pl-piece {
        from { opacity: 0; transform: translateY(60px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes pl-wave {
        0%, 100% { transform: skewX(-28deg) scaleY(0.45); opacity: 0.55; }
        40% { transform: skewX(-28deg) scaleY(1); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pl-box, .pl-mark path { animation: none; }
        .pl-stripes i { animation: none; transform: skewX(-28deg); }
        #preload { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="preload" role="status" aria-live="polite">
      <div class="pl-box">
        <svg class="pl-mark" viewBox="0 0 1254 1254" aria-hidden="true">
          <rect width="1254" height="1254" rx="280" fill="#F5F5F5" />
          <g transform="translate(627 640) scale(0.78) translate(-619.5 -598)">
            <path d="M628 140 L703 255 L296 887 L128 887 Z" fill="#174CB5" />
            <path d="M736 318 L1186 1056 L1007 1056 L651 446 Z" fill="#012367" />
            <path d="M626 562 L826 887 L403 887 Z" fill="#010101" />
            <path d="M130 944 L868 944 L932 1056 L53 1056 Z" fill="#CF3102" />
          </g>
        </svg>
        <p class="pl-word" aria-hidden="true">FLUXO<span>NEO</span></p>
        <div class="pl-stripes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <span class="pl-sr">Carregando o FLUXO NEO…</span>
      </div>
    </div>
    <script>
      // Rede de segurança: se o app não avisar que está pronto (erro ao carregar), o preload sai sozinho.
      setTimeout(function () {
        var el = document.getElementById('preload')
        if (el) el.classList.add('pl-hide')
      }, 12000)
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
